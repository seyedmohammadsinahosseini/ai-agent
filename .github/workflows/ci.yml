name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server-tests:
    name: Server tests (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r server/requirements-dev.txt

      - name: Run server test suite
        run: python -m pytest server/tests -q

  engine-tests:
    name: Native engine tests (C++)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pybind11

      - name: Configure native engine
        run: >
          cmake -S engine -B engine/build
          -DPython_EXECUTABLE="$(which python)"
          -Dpybind11_DIR="$(python -c 'import pybind11; print(pybind11.get_cmake_dir())')"
          -DBUILD_TESTING=ON

      - name: Build native engine
        run: cmake --build engine/build --parallel

      - name: Run native tests
        run: ctest --test-dir engine/build --output-on-failure
